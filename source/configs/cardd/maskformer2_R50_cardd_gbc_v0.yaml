_BASE_: "maskformer2_R50_cardd_baseline.yaml"

# P4-GBC-v0: training-only geometry-weighted boundary consistency. Inference
# remains identical to the baseline, isolating the effect of boundary learning.
MODEL:
  MASK_FORMER:
    GBC:
      ENABLED: True
      WEIGHT: 1.0
      BAND_WIDTH: 1
      DICE_WEIGHT: 1.0
      BCE_WEIGHT: 0.5
      SMALL_AREA_RATIO: 0.01
      GEO_WEIGHT_MAX: 2.0
      AUX_LAYERS: 3
